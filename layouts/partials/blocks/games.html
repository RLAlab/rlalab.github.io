{{ $page := .wcPage }}
{{ $block := .wcBlock }}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="section-heading text-center mb-4">
        {{ with $block.content.title }}
          <h1 class="mb-0">{{ . | markdownify | emojify }}</h1>
        {{ end }}
        {{ with $block.content.subtitle }}
          <p class="mt-1">{{ . | markdownify | emojify }}</p>
        {{ end }}
      </div>
    </div>
  </div>
</div>
